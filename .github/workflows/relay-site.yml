name: Relay and site verification

on:
  push:
    branches: [main]
    paths:
      - 'alexa-relay/**'
      - 'site/**'
      - '.github/workflows/relay-site.yml'
  pull_request:
    paths:
      - 'alexa-relay/**'
      - 'site/**'
      - '.github/workflows/relay-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Alexa relay tests (no dependencies to install)
        run: npm test
        working-directory: alexa-relay
      - name: Install locked site dependencies
        run: npm ci
        working-directory: site
      - name: Build the site
        run: npx astro build
        working-directory: site
