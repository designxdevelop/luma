name: Android verification

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/src/test/fixtures/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'desktop/src/test/fixtures/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: android

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install the compile SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon test assembleDebug
