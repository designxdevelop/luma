name: Android release

# Manual: builds a signed AAB (versionCode = run number, versionName stays 1.0) and uploads it
# to the Play internal testing track. See docs/PLAY.md for the secrets; the first upload must be manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.LUMA_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null
      - name: Restore upload key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.LUMA_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build bundle
        env:
          LUMA_UPLOAD_KEYSTORE: ${{ env.HAS_KEY == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          LUMA_UPLOAD_PASSWORD: ${{ secrets.LUMA_UPLOAD_PASSWORD }}
        run: ./gradlew --no-daemon test bundleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with: { name: luma-android-aab, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Upload to Play internal testing
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.designxdevelop.luma
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
